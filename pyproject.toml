[project]
name = "slcfg"
version = "0.1.0"
description = "Configure a Novation ReMOTE SL (Mk1) from JSON templates and a Textual TUI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mido>=1.3",
    "python-rtmidi>=1.5",
    "textual>=0.80",
    "typer>=0.12",
]

[project.scripts]
slcfg = "slcfg.cli:app"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slcfg"]

[tool.ruff]
line-length = 100
extend-exclude = [".claude"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["animated: run Textual apps with animations on"]

[tool.ruff.lint.isort]
known-first-party = ["slcfg", "conftest"]
